<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>確認用のページ</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <script type="module" src="./checks.js"></script>
  </head>
  <body>
    <section>
      <h2>確認用のページ</h2>
      <p>作者の JS から、次の操作が止められているかを確かめます。共有 URL の viewer の中で開いてください。</p>
      <table>
        <thead>
          <tr><th>項目</th><th>結果</th><th>期待</th></tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <p>
        <button type="button" id="popup">別のタブを開く</button>
        <button type="button" id="top">viewer の外へ移動する</button>
      </p>
      <form method="post" action="/checks/">
        <button>form を送信する</button>
      </form>
      <p><small>ボタンを押しても、別のタブが開かず、viewer から移らず、ページが送信されなければ期待どおりです。</small></p>
      <p><a href="/">スライドに戻る</a></p>
    </section>
  </body>
</html>
