<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>同じ path に別の中身</title>
    <!-- Same paths as sample-static, different bytes. -->
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="./assets/deck.js"></script>
  </head>
  <body>
    <main id="deck">
      <section>
        <small>Slide sample: twin</small>
        <h1>同じ path に別の中身</h1>
        <p>この deck は sample-static と同じ path に、違う内容のファイルを置いています。</p>
        <p class="hint">背景が明るい色なら、この deck のファイルです</p>
        <p><small>ページが進まないときは <a href="/checks/">確認用のページ</a> で touch の記録を見られます。</small></p>
      </section>
      <section>
        <h2>見分け方</h2>
        <img src="images/flow.svg" alt="橙色の枠で twin と書かれた図" />
        <p>図が橙色で「twin」と書かれていれば、この deck の画像です。</p>
      </section>
      <section>
        <h2>確認用のページ</h2>
        <p>作者の JS からの操作が止められているかを <a href="/checks/">確認用のページ</a> で見られます。</p>
        <p>このページの番号: <output id="page"></output></p>
      </section>
    </main>
  </body>
</html>
